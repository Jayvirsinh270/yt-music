name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    uses: ./.github/workflows/build-apk.yml

  publish-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Linus-Player-APK
          path: dist

      - name: Rename APK with release tag
        run: |
          mv dist/app-release.apk "dist/Linus-Music-Player-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Linus-Music-Player-*.apk
