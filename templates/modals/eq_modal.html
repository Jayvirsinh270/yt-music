  <dialog id="eq-sheet" class="eq-sheet">
    <div class="eq-container">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">AUDIOPHILE DSP</p>
          <h2>Sound Processor & 8D Spatial</h2>
        </div>
        <button class="round-action" id="eq-close"><i class="ph ph-x"></i></button>
      </div>

      <!-- Presets Row -->
      <div class="eq-presets-bar">
        <span class="eq-presets-label">Presets:</span>
        <div class="eq-presets-list" id="eq-presets-list">
          <button class="eq-preset-btn active" data-preset="flat">Flat</button>
          <button class="eq-preset-btn" data-preset="bass">Bass Boost</button>
          <button class="eq-preset-btn" data-preset="cyberpunk">Cyberpunk Synth</button>
          <button class="eq-preset-btn" data-preset="vocal">Vocal Sparkle</button>
          <button class="eq-preset-btn" data-preset="acoustic">Acoustic Live</button>
          <button class="eq-preset-btn" data-preset="nightcore">Nightcore</button>
          <button class="eq-preset-btn" data-preset="immersion">Deep Immersion</button>
        </div>
      </div>

      <!-- 10-Band Sliders Stage -->
      <div class="eq-sliders-stage" id="eq-sliders-stage"></div>

      <!-- Extra DSP Enhancers: Bass Booster & 8D Spatial Audio -->
      <div class="eq-dsp-row">
        <!-- Bass Booster -->
        <div class="eq-dsp-card">
          <div class="dsp-card-header">
            <i class="ph-fill ph-speaker-simple-high" style="color:var(--accent);"></i>
            <strong>Sub-Bass Booster</strong>
            <span class="dsp-val" id="bass-boost-val">+0 dB</span>
          </div>
          <input type="range" id="bass-boost-slider" min="0" max="14" step="0.5" value="0">
        </div>

        <!-- 8D Spatial Audio -->
        <div class="eq-dsp-card">
          <div class="dsp-card-header">
            <i class="ph-fill ph-headphones" style="color:var(--accent);"></i>
            <strong>8D 360° Spatial Audio</strong>
            <label class="switch">
              <input type="checkbox" id="spatial-toggle">
              <span class="slider round"></span>
            </label>
          </div>
          <div class="spatial-controls" id="spatial-controls" style="display:flex;align-items:center;gap:10px;margin-top:8px;">
            <span style="font-size:11px;color:var(--text-muted);">Orbit Speed:</span>
            <input type="range" id="spatial-speed-slider" min="0.1" max="0.8" step="0.05" value="0.25" style="flex:1;">
            <div class="spatial-orbit-indicator" id="spatial-orbit-indicator">
              <div class="orbit-center"></div>
              <div class="orbit-satellite" id="orbit-satellite"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="eq-footer">
        <button class="btn-secondary" id="eq-reset-btn"><i class="ph ph-arrow-counter-clockwise"></i> Reset EQ</button>
      </div>
    </div>
  </dialog>
