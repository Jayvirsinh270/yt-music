  <dialog id="playlist-create-sheet">
    <form method="dialog" id="playlist-create-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">CURATION</p>
          <h2>Create Playlist</h2>
        </div>
        <button type="button" class="round-action" id="playlist-create-close"><i class="ph ph-x"></i></button>
      </div>
      <div class="field-group">
        <label for="playlist-name-input">Playlist Title</label>
        <input type="text" id="playlist-name-input" class="field-input" placeholder="e.g. Midnight Drive, Lofi Study, Acoustic..." required autocomplete="off">
      </div>
      <div class="dialog-actions" style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;">
        <button type="button" class="btn-secondary" id="playlist-create-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="playlist-create-submit"><i class="ph ph-plus"></i> Create Playlist</button>
      </div>
    </form>
  </dialog>
